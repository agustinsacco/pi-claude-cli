name: Publish
# Publishes when the version in package.json is new to npm. The normal flow
# is: bump the version in a PR, merge to main, and this workflow publishes
# and tags it. Tag pushes and manual dispatch also work.
#
# A merge whose version is already on npm publishes nothing. That is correct —
# most merges are not releases — but it used to be SILENT, and a green check on
# a feature merge reads as "shipped". It was not: observer mode (#17) merged,
# went green, published nothing, and users stayed on the old build for a day
# while the bug it fixed kept costing tokens. So a skip now annotates the run
# and says exactly what to do about it.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Require NPM_TOKEN secret
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::NPM_TOKEN repo secret is not set. Add a granular npm automation token (read/write on @saccolabs) under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - run: npm ci

      - name: Validate version match (tag pushes)
        if: github.ref_type == 'tag'
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi

      - name: Is this version new to npm?
        id: version
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "name=$PKG_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"
          if npm view "$PKG_NAME@$PKG_VERSION" version >/dev/null 2>&1; then
            echo "$PKG_NAME@$PKG_VERSION is already on npm — nothing to publish."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      # Says out loud that this run shipped nothing. Without it the only signal
      # is a green check, which is indistinguishable from a successful release.
      - name: Warn when a main merge publishes nothing
        if: steps.version.outputs.new == 'false' && github.event_name == 'push'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "::warning title=No release published::package.json is still $VERSION, which is already on npm. This merge changed code but shipped nothing. Bump the version and merge again to release."
          {
            echo "### No release published"
            echo
            echo "\`package.json\` is still **$VERSION**, already on npm, so this run published nothing."
            echo
            echo "If this merge was meant to ship, bump the version and merge again:"
            echo
            echo '```bash'
            echo "npm version patch --no-git-tag-version   # or minor / major"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - run: npm run test

      - name: Publish to npm
        if: steps.version.outputs.new == 'true'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Tag and create GitHub release
        if: steps.version.outputs.new == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          generate_release_notes: true

      - name: Say what shipped
        if: steps.version.outputs.new == 'true'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "::notice title=Published::${{ steps.version.outputs.name }}@$VERSION is live on npm."
          {
            echo "### Published"
            echo
            echo "**${{ steps.version.outputs.name }}@$VERSION** is live on npm and tagged \`v$VERSION\`."
          } >> "$GITHUB_STEP_SUMMARY"
